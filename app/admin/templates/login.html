<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — HEX PROTOCOL</title>
<link rel="stylesheet" href="/admin/static/css/style.css">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark large">H</div>
        <h1>HEX PROTOCOL</h1>
        <p>License administration console</p>
      </div>

      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/admin/login" class="login-form">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required autofocus>

        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
    </div>
    <p class="login-footnote">Secured session · HTTPS required in production</p>
  </div>
</body>
</html>
