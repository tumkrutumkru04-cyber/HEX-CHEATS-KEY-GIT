{% extends "base.html" %}
{% block title %}Settings — HEX PROTOCOL{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h1 class="page-title">Settings</h1>
    <p class="page-subtitle">Manage your admin account</p>
  </div>
</div>

<div class="panel" style="max-width: 460px;">
  <div class="panel-header">
    <h2 class="panel-title">Change Password</h2>
  </div>
  <form id="passwordForm">
    <div class="form-group" style="margin-bottom:14px;">
      <label>Current password</label>
      <input type="password" class="input" id="currentPassword" required>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>New password</label>
      <input type="password" class="input" id="newPassword" minlength="8" required>
      <span class="form-hint">At least 8 characters.</span>
    </div>
    <button type="submit" class="btn btn-primary" id="savePasswordBtn">Update Password</button>
  </form>
</div>

<div class="panel" style="max-width: 460px;">
  <div class="panel-header">
    <h2 class="panel-title">Account</h2>
  </div>
  <p class="text-secondary" style="font-size:13.5px; margin:0;">Signed in as <strong>{{ admin.username }}</strong></p>
</div>

{% endblock %}
{% block scripts %}
<script src="/admin/static/js/settings.js"></script>
{% endblock %}
