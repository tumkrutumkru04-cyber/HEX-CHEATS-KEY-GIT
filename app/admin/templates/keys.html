{% extends "base.html" %}
{% block title %}License Keys — HEX PROTOCOL{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h1 class="page-title">License Keys</h1>
    <p class="page-subtitle">Manage, search, and moderate all license keys</p>
  </div>
  <a href="/admin/generate" class="btn btn-primary">+ Generate Keys</a>
</div>

<div class="panel">
  <div class="toolbar">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="input" id="searchInput" placeholder="Search by license key…">
    </div>
    <select class="input" id="statusFilter">
      <option value="ALL">All statuses</option>
      <option value="ACTIVE">Active</option>
      <option value="INACTIVE">Inactive</option>
      <option value="EXPIRED">Expired</option>
      <option value="BANNED">Banned</option>
    </select>
  </div>

  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>License Key</th>
          <th>Status</th>
          <th>Duration</th>
          <th>Devices</th>
          <th>Expires</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="keysBody">
        <tr class="loading-row"><td colspan="7"><div class="spinner" style="margin:0 auto;"></div></td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <span class="pagination-info" id="paginationInfo"></span>
    <div class="pagination-controls">
      <button class="btn btn-ghost btn-sm" id="prevPageBtn">Prev</button>
      <span class="text-secondary" id="pageIndicator" style="font-size:13px;"></span>
      <button class="btn btn-ghost btn-sm" id="nextPageBtn">Next</button>
    </div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script src="/admin/static/js/keys.js"></script>
{% endblock %}
